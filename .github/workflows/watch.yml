name: Sentinel Watch (Live API)

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (Reliable cron rotation & safety net)
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

concurrency:
  group: sentinel-live
  cancel-in-progress: true # Seamless handover to the new runner

jobs:
  live_watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon requests

      - name: Run Live Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_GENERAL: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting Live Sentinel with 3-second safety margin..."
          sleep 3
          python -u backend/live_sentinel.py

      - name: Auto-Restart on Exit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next live sentinel runner..."
          for i in 1 2 3; do
            echo "Attempt $i: Dispatching watch.yml on main..."
            gh workflow run watch.yml --ref main && break || sleep 5
          done || true
