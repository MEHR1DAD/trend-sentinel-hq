name: Sentinel Watch (v4 Pure Engine)

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes cron rotation & safety net
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'session_report.md'
      - 'posted_registry.json'
      - 'channel_state.json'
      - 'analytics_results/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  actions: write

concurrency:
  group: sentinel-live
  cancel-in-progress: true

jobs:
  live_watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon

      - name: Run Sentinel v4 Live Engine
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_GENERAL: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
          MAX_RUNTIME_SEC: "1740" # 29 minutes
        run: |
          echo "🚀 Starting Trend Sentinel v4 Pure-Python Engine..."
          sleep 3
          python -u main.py

      - name: Persist Session State
        if: always() && !cancelled()
        run: |
          git config --global user.name "Sentinel Watcher"
          git config --global user.email "sentinel@sentinel.hq"
          git pull --rebase origin main || true
          git add session_report.md posted_registry.json channel_state.json
          git commit -m "📊 [skip ci] update sentinel v4 state" || echo "No changes"
          git push origin main || true

      - name: Auto-Restart on Exit
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Handing over to next runner cycle..."
          gh workflow run watch.yml --ref main || true
