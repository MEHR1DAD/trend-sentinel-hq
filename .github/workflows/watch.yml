name: Sentinel Watch (Live API)

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours (Guarantees overlap or restart)
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

concurrency:
  group: sentinel-live
  cancel-in-progress: true # If a new cron triggers, kill the old one (prevent overlaps)

jobs:
  live_watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5.8 hours
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon requests

      - name: Run Live Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_GENERAL: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
        run: python backend/live_sentinel.py

      - name: Auto-Restart on Exit
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering the next run immediately..."
          gh workflow run watch.yml --ref main || true
