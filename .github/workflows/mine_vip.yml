name: Mine VIP Corpus (1m to 2y)

on:
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target VIP Channel (or ALL for all 7 channels)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - VahidOnline
          - withyashar
          - Alibk3
          - Ali_bk_8
          - iliaen
          - netblocks
          - kianmeli1
      max_days:
        description: 'Max History Depth in Days (730 = 2 Years, 365 = 1 Year, 180 = 6 Months)'
        required: true
        default: '730'

permissions:
  contents: write
  actions: write

jobs:
  mine-vip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Execute Corpus Frequency Miner
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_GENERAL: ${{ secrets.TELEGRAM_SESSION_GENERAL }}
          TARGET_CHANNEL: ${{ inputs.target_channel || 'ALL' }}
          MAX_DAYS: ${{ inputs.max_days || '730' }}
        run: |
          python mine_vip_corpus.py

      - name: Commit & Push Analytics Results
        run: |
          git config --global user.name "Sentinel Analytics"
          git config --global user.email "analytics@sentinel.bot"
          git pull --rebase origin main || true
          git add analytics_results/
          git commit -m "📊 Analytics: Update VIP corpus frequency clouds [skip ci]" || echo "No changes to commit"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload Analytics Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vip-corpus-analytics
          path: analytics_results/
